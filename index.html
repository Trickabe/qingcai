<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>青财智管 - 青年人的智能财富成长助手</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css?v=3" />
  <style>
    /* 演示提示弹层内联样式：确保在静态托管环境下不会作为普通区块渲染到页面底部 */
    .notice-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:rgba(16,52,54,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);place-items:center;padding:20px}
    .notice-overlay:not(.show){display:none!important}
    .notice-overlay.show{display:grid}
    .notice-card{width:100%;max-width:460px;background:#fff;border-radius:20px;padding:30px 28px;box-shadow:0 30px 80px rgba(10,40,40,.35);max-height:90vh;overflow-y:auto}
    .notice-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:#173a3d;margin-bottom:4px}
    .notice-mark{background:linear-gradient(135deg,#35c9b8,#268ee0);color:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-family:Georgia;font-size:24px}
    .notice-brand small{display:block;font-size:10px;color:#789093;letter-spacing:1px;font-weight:400;margin-top:2px}
    .notice-card h1{font-size:22px;margin:14px 0 4px}
    .notice-sub{color:#789093;margin:0 0 20px;line-height:1.6}
    .notice-points{list-style:none;margin:0;padding:0;display:grid;gap:11px}
    .notice-points li{display:flex;gap:12px;align-items:flex-start;background:#f7fbfa;border:1px solid #e7efee;border-radius:12px;padding:12px}
    .notice-points li>span{font-size:22px;line-height:1}
    .notice-points b{font-size:14px;display:block}
    .notice-points p{margin:3px 0 0;color:#789093;font-size:12px;line-height:1.5}
    .notice-enter{width:100%;margin-top:22px;padding:13px;font-size:15px}
    @media(max-width:600px){.notice-card{padding:24px 20px}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#dashboard"><span class="brand-mark">Q</span><span>青财智管<small>QINGCAI</small></span></a>
      <div class="profile-mini"><div class="avatar">秾</div><div><b>秾工诚</b><small>成长 Lv.3 · 稳步前行</small></div></div>
      <nav id="nav" aria-label="主导航"></nav>
      <div class="sidebar-bottom"><button class="outline-btn" id="notificationBtn">🔔 风险提醒 <i>2</i></button><button class="text-btn" data-page="settings">⚙ 设置与授权</button></div>
    </aside>
    <main class="main"><header class="topbar"><button class="mobile-menu" id="menuBtn" aria-label="打开导航菜单"><span class="mm-icon">☰</span><span class="mm-text">菜单</span></button><div id="crumb">今日概览</div><div class="top-actions"><span class="date">2026年9月 · 新学期开始</span><button class="help-btn" onclick="showToast('需要帮助？试试问问青财 AI')">?</button></div></header><div id="view"></div></main>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <button class="nav-hint" id="navHint" onclick="setSidebar(true)">📚 8 个功能模块 · 点这里切换</button>
  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modal"></div>
  <div class="notice-overlay" id="notice">
    <div class="notice-card">
      <div class="notice-brand"><span class="notice-mark">Q</span><span>青财智管<small>QINGCAI</small></span></div>
      <h1>欢迎体验青财智管</h1>
      <p class="notice-sub">青年人的智能财富成长助手 · 概念演示版</p>
      <ul class="notice-points">
        <li><span>🖥️</span><div><b>建议使用 PC 端访问</b><p>在桌面浏览器中可获得更佳的布局与交互体验</p></div></li>
        <li><span>🧪</span><div><b>后端服务开发中</b><p>当前为纯前端概念演示，部分功能为本地模拟</p></div></li>
        <li><span>🎭</span><div><b>数据均为虚构</b><p>页面中的用户、金额与图表均为演示数据</p></div></li>
        <li><span>📌</span><div><b>仅供展示</b><p>不构成任何投资建议或收益承诺</p></div></li>
      </ul>
      <button class="primary-btn notice-enter" id="noticeEnter">进入演示</button>
    </div>
  </div>
  <script src="app.js?v=3"></script>
</body>
</html>
